spring:
  application:
    name: User

  datasource:
    url: jdbc:postgresql://localhost:5432/shopsphere_user
    username: rohit
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

app:
  file:
    upload-dir: ./uploads/users

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000